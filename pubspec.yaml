name: zoom_clone_tutorial
description: ConnectNow - A video meetings app.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5

  # Google Sign In
  google_sign_in: ^6.2.1

  # Video Calling - Agora
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1

  # UI helpers
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
